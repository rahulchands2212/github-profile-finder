<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>result page</title>
    <link rel="stylesheet" href="result.css" />
  </head>
  <body>
    <div class="overlaycard">
        <!--loader-->
           <div class="loader" id="loader"></div>
      <div class="container">
        <div class="box">
          <div class="profileimage">
            <img
              src="https://images.openai.com/static-rsc-4/xA7fw3KMqYj4qvAJcJmnBgTEicRFg9iLK76HkWAFGAsVfyUyWPxKNjbTgUekso3S301Z_C3EckemERxH4Po3rNZh8BvCwEQRhOOh6_v5zOK1o6aHs3RTArxpnbsaI6ZlJHBfrPMlfe_tFMNZcREedEW5i66UAJh_L0MVeaFdjK87TiYWPh0Di0NieL5DnX_L?purpose=fullsize"
              width="100%"
              height="100%"
            />
          </div>
          
          <div class="info">
            <span class="name"></span>
            <span class="username"></span>
            <span class="bio"></span>
            <span class="gitlink"></span>
          </div>
        </div>

        <div class="follow">
          <div class="follower">
            <span class="follownum">50M</span>
            <span>follower </span>
          </div>
          <div class="following">
            <span class="followingnum">0</span>
            <span>following </span>
          </div>
          <div class="repo">
            <span class="reponum">1.5k</span>
            <span> repositories</span>
          </div>
        </div>
      </div>
    </div>
    <script src="./result.js"></script>
